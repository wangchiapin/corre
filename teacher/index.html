<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑吧！漢字 · 教師版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060911; --panel:rgba(8,14,24,0.94);
    --cyan:#00fff2; --cyan-dim:rgba(0,255,242,0.35);
    --magenta:#ff2fd0; --purple:#b537f2; --green:#39ff88; --danger:#ff2f6d; --gold:#ffd54f;
    --text:#eafcff; --text-dim:#7fa3ac; --line:rgba(0,255,242,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;background:#000;}
  body{font-family:'Work Sans','Noto Sans TC',sans-serif;color:var(--text);}
  #page{
    max-width:720px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
    border-left:1px solid var(--cyan-dim);border-right:1px solid var(--cyan-dim);
    box-shadow:0 0 40px rgba(0,255,242,0.12),0 0 90px rgba(255,47,208,0.08);
    padding-bottom:60px;
  }
  #page::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
    background-image:repeating-linear-gradient(180deg,rgba(0,255,242,0.03) 0 1px,transparent 1px 3px),
      radial-gradient(circle at 20% 10%,rgba(181,55,242,0.10) 0,transparent 45%),
      radial-gradient(circle at 85% 85%,rgba(0,255,242,0.08) 0,transparent 45%);
  }
  #page > *{position:relative;z-index:1;}

  header{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
  .brand{
    font-family:'Orbitron','Noto Sans TC',sans-serif;font-weight:900;font-size:24px;margin:0;color:var(--cyan);
    text-shadow:0 0 8px var(--cyan),0 0 22px rgba(0,255,242,0.5),2px 0 var(--magenta);
  }
  .brand small{font-size:13px;color:var(--magenta);text-shadow:none;margin-left:6px;font-weight:700;}
  .sub{margin:6px 0 0;color:var(--text-dim);font-size:13px;}
  .toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .langs{display:flex;gap:4px;margin-left:auto;}
  .langs button{
    padding:5px 9px;border-radius:6px;border:1.5px solid var(--line);background:rgba(0,255,242,0.04);
    color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;
  }
  .langs button.on{background:rgba(255,47,208,0.18);color:var(--magenta);border-color:var(--magenta);}
  .who{font-size:12.5px;color:var(--text-dim);word-break:break-all;}
  .who.ok{color:var(--green);}

  section{padding:16px 18px;border-bottom:1px solid var(--line);}
  h2{font-family:'Orbitron','Noto Sans TC',sans-serif;font-size:14px;letter-spacing:.5px;color:var(--cyan);margin:0 0 8px;}
  h3{font-size:13px;color:var(--text);margin:14px 0 4px;}
  .hint{font-size:12px;color:var(--text-dim);margin:0 0 8px;line-height:1.5;}

  .btn{
    padding:9px 18px;border-radius:22px;border:1.5px solid var(--cyan);cursor:pointer;
    background:linear-gradient(90deg,rgba(0,255,242,0.18),rgba(255,47,208,0.18));
    color:var(--text);font-family:'Orbitron','Noto Sans TC',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.4px;
    box-shadow:0 0 12px rgba(0,255,242,0.3);
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--text-dim);font-family:inherit;font-weight:600;}
  .btn.danger{border-color:var(--danger);color:var(--danger);background:transparent;box-shadow:none;font-family:inherit;}
  .btn.small{padding:6px 12px;font-size:12px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal[hidden]{display:none;}
  .modal-box{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:18px;max-width:420px;width:100%;max-height:92vh;overflow:auto;}
  .modal-x{position:absolute;top:6px;right:10px;background:none;border:0;color:var(--text-dim);font-size:26px;cursor:pointer;}
  .qr-img{width:100%;max-width:300px;display:block;margin:8px auto;border-radius:8px;}
  .chk{display:block;margin:10px 0;font-size:14px;cursor:pointer;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}

  textarea,input[type=text]{
    width:100%;font-family:'Noto Sans TC','Work Sans',sans-serif;font-size:15px;color:var(--text);
    border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;background:rgba(0,255,242,0.04);resize:vertical;
  }
  textarea{min-height:48px;}
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 8px rgba(0,255,242,0.4);}
  label.lbl{display:block;font-size:11px;color:var(--text-dim);margin:10px 0 4px;font-weight:600;letter-spacing:.4px;font-family:'Orbitron','Noto Sans TC',sans-serif;}
  .toggle-group{display:flex;gap:6px;}
  .toggle-btn{
    flex:1;padding:9px 4px;border-radius:6px;border:1.5px solid var(--line);background:rgba(0,255,242,0.04);
    font-size:12.5px;font-family:inherit;cursor:pointer;color:var(--text);
  }
  .toggle-btn.active{background:rgba(255,47,208,0.18);color:var(--magenta);border-color:var(--magenta);box-shadow:0 0 10px rgba(255,47,208,0.35);}

  .status{font-size:12.5px;color:var(--text-dim);margin-top:8px;min-height:16px;line-height:1.45;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--green);}
  .notice{
    margin:0 0 12px;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;
    border:1.5px solid var(--gold);background:rgba(255,213,79,0.08);color:var(--gold);
  }
  .notice.err{border-color:var(--danger);background:rgba(255,47,109,0.08);color:#ff9bb5;}

  .badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;background:rgba(0,255,242,0.14);color:var(--cyan);}
  .badge.pro{background:var(--gold);color:#3b2b00;}

  .bank{
    border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel);
  }
  .bank.empty{border-style:dashed;}
  .bank.locked{opacity:.55;}
  .bank .t{font-weight:700;font-size:15px;}
  .bank .meta{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .bank .paused{font-size:12px;color:var(--danger);margin-top:4px;}

  #tokenTable{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .token-row,.col-labels{display:grid;grid-template-columns:22px 1fr 1fr 1fr 28px;gap:6px;align-items:center;}
  .col-labels{font-size:10.5px;color:var(--text-dim);margin-top:10px;}
  .token-row .idx{font-size:12px;color:var(--text-dim);text-align:center;}
  .token-row input{font-size:14px;padding:7px 8px;border-radius:6px;border:1.5px solid var(--line);background:rgba(0,255,242,0.04);color:var(--text);width:100%;min-width:0;}
  .token-row .rm{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--danger);cursor:pointer;font-size:13px;}

  .sent-card{
    border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px;background:var(--panel);
    display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
  }
  .sent-card .hz{font-weight:700;font-size:16px;}
  .sent-card .py{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .sent-card .es{font-size:12.5px;color:var(--green);margin-top:3px;}
  .sent-card .en{font-size:12.5px;color:var(--text-dim);font-style:italic;margin-top:2px;}
  .sent-card .n{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .sent-card .acts{display:flex;flex-direction:column;flex-shrink:0;}
  .sent-card .acts button{background:none;border:none;cursor:pointer;font-size:18px;padding:2px 6px;}
  .counter{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--cyan);}
  .counter.warn{color:var(--gold);}
  .counter.bad{color:var(--danger);}
  .savebar{
    position:sticky;bottom:0;z-index:5;padding:10px 18px;background:rgba(6,9,17,0.96);border-top:1px solid var(--line);
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  }
  .dirty{color:var(--gold);font-size:12px;}
  .gwrap{overflow-x:auto;}
  table.gt{border-collapse:collapse;width:100%;font-size:13px;}
  table.gt th,table.gt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;}
  table.gt th{color:var(--text-dim);font-weight:600;font-size:12px;}
  h3.gh{font-size:13px;color:var(--magenta);margin:14px 0 4px;}
  select{width:100%;padding:9px 10px;background:rgba(0,0,0,.4);color:var(--text);border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;}
</style>
</head>
<body>
<div id="page">
  <header>
    <p class="brand">跑吧！漢字<small data-i18n="brandTag">教師版</small></p>
    <p class="sub" data-i18n="sub">建立自己的句庫，用連結分享給學生玩。</p>
    <div class="toprow">
      <a class="btn ghost small" id="homeLink" href="../" style="text-decoration:none;" data-i18n="toGame">← 回到遊戲</a>
      <span class="who" id="who"></span>
      <button class="btn small" id="loginBtn" data-i18n="login">使用 Google 登入</button>
      <button class="btn ghost small" id="logoutBtn" hidden data-i18n="logout">登出</button>
      <div class="langs" id="langs">
        <button data-l="zh">繁</button><button data-l="cn">简</button><button data-l="es">ES</button><button data-l="en">EN</button>
      </div>
    </div>
    <div class="status" id="authMsg"></div>
  </header>

  <!-- 未登入 -->
  <section id="viewOut">
    <p class="hint" data-i18n="loginHint">請先登入。登入後可以建立句庫，並取得給學生的連結。</p>
  </section>

  <!-- 我的句庫 -->
  <div id="viewList" hidden>
    <section>
      <h2 data-i18n="plan">方案</h2>
      <div id="planBox"></div>
      <div id="planNotice"></div>
    </section>
    <section>
      <h2 data-i18n="banks">我的句庫</h2>
      <div id="bankList"></div>
      <div class="status" id="listStatus"></div>
    </section>
    <section>
      <h2 data-i18n="clsTitle">班級成績冊</h2>
      <p class="hint" data-i18n="clsIntro"></p>
      <div id="classList"></div>
      <div class="status" id="classStatus"></div>
    </section>
  </div>

  <!-- 班級成績冊 -->
  <div id="viewClass" hidden>
    <section>
      <button class="btn ghost small" id="clsBackBtn" data-i18n="clsBack">← 回到班級列表</button>
      <div class="notice err" id="clsExpired" style="margin-top:12px;" data-i18n="clsExpired" hidden></div>
      <h2 style="margin-top:12px;" data-i18n="clsTitle">班級成績冊</h2>
      <label class="lbl" data-i18n="clsName">班級名稱</label>
      <div class="row"><input type="text" id="clsNameInput" maxlength="40" style="flex:1"><button class="btn small" id="clsRenameBtn" data-i18n="clsRename">改名</button></div>
      <label class="lbl" data-i18n="clsBoardLbl">讓學生看到班級排行榜</label>
      <div class="toggle-group" id="clsBoardGroup">
        <button class="toggle-btn" data-value="1" data-i18n="on">開</button>
        <button class="toggle-btn" data-value="0" data-i18n="off">關</button>
      </div>
      <h2 style="margin-top:16px;" data-i18n="clsLink">學生連結</h2>
      <label class="lbl" data-i18n="clsSource">題目來源</label>
      <select id="clsBankSel"></select>
      <input type="text" id="clsLinkText" readonly style="margin-top:8px;">
      <div class="row" style="margin-top:8px;">
        <button class="btn small" id="clsCopyBtn" data-i18n="copyLink">複製連結</button>
        <button class="btn ghost small" id="clsQrBtn">QR</button>
        <button class="btn ghost small" id="clsTestBtn" data-i18n="clsTest">試玩（不回傳）</button>
      </div>
      <p class="hint" data-i18n="clsHelp"></p>
    </section>
    <section>
      <h2 data-i18n="clsGrades">成績</h2> <span class="counter" id="clsCount"></span>
      <div class="row" style="margin:8px 0;">
        <button class="btn ghost small" id="clsRefreshBtn" data-i18n="clsRefresh">重新整理</button>
        <button class="btn ghost small" id="clsCsvBtn" data-i18n="clsCsv">匯出 CSV</button>
        <button class="btn danger small" id="clsResetBtn" data-i18n="clsReset">清空成績</button>
        <button class="btn danger small" id="clsDelBtn" data-i18n="clsDelClass">刪除班級</button>
      </div>
      <div class="status" id="clsStatus"></div>
      <div id="clsScores"></div>
    </section>
  </div>

  <!-- 編輯句庫 -->
  <div id="viewEdit" hidden>
    <section>
      <button class="btn ghost small" id="backBtn" data-i18n="back">← 回到我的句庫</button>
      <div id="editNotice" style="margin-top:12px;"></div>
      <h2 style="margin-top:12px;" data-i18n="bankSettings">句庫設定</h2>
      <label class="lbl" data-i18n="bankName">句庫名稱</label>
      <input type="text" id="bankName" maxlength="40">
      <label class="lbl" data-i18n="speed">速度</label>
      <div class="toggle-group" id="speedGroup">
        <button class="toggle-btn" data-value="facil" data-i18n="facil">容易</button>
        <button class="toggle-btn" data-value="normal" data-i18n="normal">普通</button>
        <button class="toggle-btn" data-value="dificil" data-i18n="dificil">困難</button>
      </div>
      <label class="lbl" data-i18n="script">字體</label>
      <div class="toggle-group" id="scriptGroup">
        <button class="toggle-btn" data-value="trad" data-i18n="trad">繁體</button>
        <button class="toggle-btn" data-value="simp" data-i18n="simp">簡體</button>
      </div>
      <label class="lbl" data-i18n="phonetic">拼音／注音</label>
      <div class="toggle-group" id="phoneticGroup">
        <button class="toggle-btn" data-value="pinyin" data-i18n="phPinyin">拼音</button>
        <button class="toggle-btn" data-value="zhuyin" data-i18n="phZhuyin">注音</button>
        <button class="toggle-btn" data-value="both" data-i18n="phBoth">兩者</button>
      </div>
      <label class="lbl" data-i18n="boss">Boss 關（聽語音）</label>
      <div class="toggle-group" id="bossGroup">
        <button class="toggle-btn" data-value="1" data-i18n="on">開</button>
        <button class="toggle-btn" data-value="0" data-i18n="off">關</button>
      </div>
    </section>

    <section>
      <h2 data-i18n="sec1">① 輸入句子</h2>
      <p class="hint" id="inputHint"></p>
      <textarea id="sentInput" placeholder="我 喜歡 吃 蘋果"></textarea>
      <label class="lbl" data-i18n="esLabel">西班牙文翻譯（必填）</label>
      <textarea id="esTop" placeholder="Me gusta comer manzanas."></textarea>
      <label class="lbl" data-i18n="enLabel">英文翻譯（選填）</label>
      <textarea id="enTop" placeholder="I like eating apples."></textarea>
      <p class="hint" style="margin-top:6px;" data-i18n="autoHint">翻譯留空會自動翻譯（機器翻譯，請務必檢查）。</p>
      <div class="row"><button class="btn" id="genBtn" data-i18n="gen">⚙️ 自動產生簡體 / 拼音 / 翻譯</button></div>
      <div class="status" id="genStatus"></div>
    </section>

    <section id="previewSection" hidden>
      <h2 data-i18n="sec2">② 檢查與微調</h2>
      <p class="hint" data-i18n="checkHint">簡體與拼音是自動轉換的（台灣讀音）。多音字或特殊唸法請自行核對修改。</p>
      <div class="col-labels"><span></span><span data-i18n="cTrad">繁體</span><span data-i18n="cSimp">簡體</span><span data-i18n="cPy">拼音</span><span></span></div>
      <div id="tokenTable"></div>
      <div class="row"><button class="btn ghost small" id="addTokenBtn" data-i18n="addCell">+ 新增一格</button></div>
      <label class="lbl" data-i18n="esLabel">西班牙文翻譯（必填）</label>
      <textarea id="esInput"></textarea>
      <label class="lbl" data-i18n="enLabel">英文翻譯（選填）</label>
      <textarea id="enInput"></textarea>
      <div class="row">
        <button class="btn" id="addSentBtn"></button>
        <button class="btn ghost" id="cancelEditBtn" hidden data-i18n="cancelEdit">取消編輯</button>
      </div>
      <div class="status" id="addStatus"></div>
    </section>

    <section>
      <h2 data-i18n="bulk">批次匯入</h2>
      <p class="hint" data-i18n="bulkHint">一行一句：詞 詞 詞 | 西班牙文 | 英文（用 | 分隔）。沒寫的翻譯會自動翻譯。</p>
      <textarea id="bulkInput" style="min-height:120px;" placeholder="我 喜歡 吃 蘋果 | Me gusta comer manzanas. | I like eating apples."></textarea>
      <div class="row">
        <button class="btn ghost" id="bulkCheckBtn" data-i18n="bulkCheck">檢查並預覽</button>
        <button class="btn" id="bulkGoBtn" hidden data-i18n="bulkGo">確認加入</button>
      </div>
      <div class="status" id="bulkStatus"></div>
      <div id="bulkPreview"></div>
    </section>

    <section>
      <h2><span data-i18n="inBank">句庫內的句子</span> <span class="counter" id="counter"></span></h2>
      <div id="sentList"></div>
    </section>

    <div class="savebar">
      <button class="btn" id="saveBankBtn" data-i18n="saveBank">💾 儲存句庫（上傳）</button>
      <span class="dirty" id="dirtyMark" hidden data-i18n="unsaved">有尚未上傳的修改</span>
      <span class="status" id="saveStatus" style="margin:0;"></span>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal-box"><button class="modal-x" id="modalClose" aria-label="close">×</button><div id="modalBody"></div></div></div>
<!-- 繁簡轉換與拼音函式庫（版本固定） -->
<script src="qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.1/dist/umd/full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.20.0/dist/index.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  const ZY = (function(){

      u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ong:'ㄨㄥ',ueng:'ㄨㄥ',
      v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ',iong:'ㄩㄥ'};

    function one(syl){
      var s = syl.normalize('NFD'), tone = 5;
      if(/̄/.test(s)) tone = 1; else if(/́/.test(s)) tone = 2; else if(/̌/.test(s)) tone = 3; else if(/̀/.test(s)) tone = 4;
      s = s.replace(/ü/g,'v').replace(/Ü/g,'v').replace(/[̀-ͯ]/g,'').replace(/ü/g,'v').toLowerCase();
      if(!/^[a-zê]+$/.test(s)) return syl;
      var ini = '', rest = s, m;
      if(s === 'n' || s === 'm'){ var zz = s === 'n' ? 'ㄣ' : 'ㄇㄨ'; return tone === 5 ? '˙' + zz : zz + MARK[tone]; }
      if(s === 'er' || s === 'r'){ rest = 'er'; }
      else if((m = s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/))){ ini = m[1]; rest = s.slice(ini.length); }
      else if(s[0] === 'y'){
        rest = s.slice(1);
        if(/^u/.test(rest)) rest = rest.replace(/^u/, 'v');          // yu yue yuan yun
        else if(rest === 'i' || rest === 'in' || rest === 'ing') rest = rest;   // yi yin ying
        else rest = 'i' + rest;                                       // ya yao yan yang yo ye you yong
      } else if(s[0] === 'w'){
        rest = s.slice(1);
        rest = (rest === 'u') ? 'u' : 'u' + rest;                      // wu / wa wo wai wei wan wen wang weng
      }
      if(ini && /^[jqx]$/.test(ini)) rest = rest.replace(/^u/, 'v');
      if(/^(zh|ch|sh|r|z|c|s)$/.test(ini) && rest === 'i') rest = '';
      var f = rest === '' ? '' : FIN[rest];
      if(f === undefined) return syl;
      var z = (ini ? INI[ini] : '') + f;
      return tone === 5 ? '˙' + z : z + MARK[tone];
    }
    function conv(py){ return String(py||'').trim().split(/\s+/).filter(Boolean).map(one).join(' '); }
    return { one: one, conv: conv };
  })();

  function fixYiBu(trad, pinyinArr){
    return pinyinArr.map((py,i)=>{
      const t = trad[i], next = pinyinArr[i+1], nextTrad = trad[i+1];
      if(t !== '不' && t !== '一') return py;
      if(!next) return py;
      const nt = toneOf(next);
      if(t === '不') return nt === 4 ? 'bú' : 'bù';
      if(isDigits(nextTrad)) return py;
      if(nt === 4) return 'yí';
      if(nt >= 1) return 'yì';
      return 'yì';
    });
  }

    return { trad, simp, pinyin };

  async function runGenerate(){
    const raw = sentInput.value.trim();
    const st = $('genStatus');
    if(!raw){ setStatus(st, tr('needInput'), 'err'); return; }
    const trad = raw.split(/\s+/).filter(Boolean);
    const han = countHan(trad);
    if(han > MAX_CHARS){ setStatus(st, tr('tooLong', { n: han, max: MAX_CHARS }), 'err'); return; }
    $('genBtn').disabled = true; setStatus(st, tr('genWorking'));
    try{
      const simp = trad.map(t => toSimplified(t));
      const py = fixYiBu(trad, trad.map((t, i) => toPinyinTW(t, simp[i])));
      let es = esTop.value.trim(), en = enTop.value.trim(), auto = false, enFailed = false;
      if(!es){ setStatus(st, tr('genTranslating')); es = await translateZh(simp.join(''), 'es'); esTop.value = es; auto = true; }
      if(!en){ try{ en = await translateZh(simp.join(''), 'en'); enTop.value = en; auto = true; }catch(e){ enFailed = true; } }
      renderTokenRows({ trad, simp, pinyin: py });
      esInput.value = es; enInput.value = en;
      $('previewSection').hidden = false;
      setStatus(st, (auto ? tr('genDone') : tr('genDoneNoAuto')) + (enFailed ? ' ' + tr('enFailed') : ''), 'ok');
    }catch(e){

    }finally{ $('genBtn').disabled = false; }
  }

    if(!tk.trad.length || !tk.simp.length || !tk.pinyin.length){ setStatus(st, tr('emptyCells'), 'err'); return; }
    if(tk.trad.length !== tk.simp.length || tk.trad.length !== tk.pinyin.length){ setStatus(st, tr('mismatch'), 'err'); return; }
    const han = countHan(tk.trad);
    if(han > MAX_CHARS){ setStatus(st, tr('tooLong', { n: han, max: MAX_CHARS }), 'err'); return; }
    if(han < 1){ setStatus(st, tr('needInput'), 'err'); return; }

  async function bulkCheck(){
    bulkReady = []; $('bulkGoBtn').hidden = true; $('bulkPreview').textContent = '';
    const lines = $('bulkInput').value.split('\n').map(l => l.trim()).filter(Boolean);
    const st = $('bulkStatus');
    if(!lines.length){ setStatus(st, tr('needInput'), 'err'); return; }
    $('bulkCheckBtn').disabled = true; setStatus(st, tr('genWorking'));
    const have = new Set(ED.sentences.map(s => keyOf(s.trad)));
    let room = cap() - ED.sentences.length, ok = 0, skip = 0;
    try{
      for(let i = 0; i < lines.length; i++){
        const parts = lines[i].split('|');
        const tk = makeTokens(parts[0]);
        if(!tk.trad.length) continue;
        let es = (parts[1] || '').trim(), en = (parts[2] || '').trim(), note = '', bad = false;
        const han = countHan(tk.trad), key = keyOf(tk.trad);
        if(han < 1 || han > MAX_CHARS){ note = tr('skipLong', { max: MAX_CHARS }); bad = true; }
        else if(have.has(key)){ note = tr('skipDup'); bad = true; }
        else if(room <= 0){ note = tr('skipFull'); bad = true; }
        else{
          if(!es){
            setStatus(st, tr('genTranslating') + ' (' + (i + 1) + '/' + lines.length + ')');
            try{ es = await translateZh(tk.simp.join(''), 'es'); note = tr('autoTr'); }catch(e){ note = tr('skipTr'); bad = true; }
          }
          if(!bad && !en){ try{ en = await translateZh(tk.simp.join(''), 'en'); note = tr('autoTr'); }catch(e){ en = ''; } }
        }
        if(!bad){ have.add(key); room--; ok++; bulkReady.push({ trad: tk.trad, simp: tk.simp, pinyin: tk.pinyin, es, en }); } else skip++;
        const card = mk('div', 'sent-card'); const info = mk('div');
        info.appendChild(mk('div', 'hz', tk.trad.join(' · ')));
        info.appendChild(mk('div', 'py', phText(tk.pinyin.join('  '), ED && ED.phonetic)));
        info.appendChild(mk('div', 'es', es || '')); info.appendChild(mk('div', 'en', en || ''));
        if(note) info.appendChild(mk('div', 'n', note));
        card.appendChild(info); if(bad) card.style.opacity = '.5';
        $('bulkPreview').appendChild(card);
      }
      setStatus(st, tr('bulkRes', { ok, skip }), 'ok');
      $('bulkGoBtn').hidden = bulkReady.length === 0;
    }catch(e){ console.error(e); setStatus(st, e.message || 'error', 'err'); }
    finally{ $('bulkCheckBtn').disabled = false; }
  }
  function bulkGo(){

  async function saveBank(){
    const st = $('saveStatus');
    if(!ED || !isRealUser(user)){ setStatus(st, tr('needLogin'), 'err'); return; }
    const name = ($('bankName').value || '').trim().slice(0, 40) || tr('autoNameDefault');
    if(!ED.sentences.length){ setStatus(st, tr('needOne'), 'err'); return; }
    const n = ED.sentences.length;

    const pro = ED.slot > 0 || n > FREE_SENT;
    if(pro && !PLAN.active){ setStatus(st, tr('needSub'), 'err'); return; }
    if(!ED.sentences.every(s => countHan(s.trad) >= 1 && countHan(s.trad) <= MAX_CHARS)){ setStatus(st, tr('tooLong', { n: '>' + MAX_CHARS, max: MAX_CHARS }), 'err'); return; }
    $('saveBankBtn').disabled = true; setStatus(st, tr('saving'));
    try{
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      const clean = ED.sentences.map(s => ({ trad: s.trad, simp: s.simp, pinyin: s.pinyin, es: s.es, en: s.en || '' }));

  // ---- QR ----
  function qrCanvas(url, title){
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), quiet = 4, cell = Math.floor(560 / (n + quiet * 2)), qs = cell * (n + quiet * 2);
    const W = qs + 80, H = qs + 190;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#000';
    for(let r = 0; r < n; r++) for(let k = 0; k < n; k++) if(qr.isDark(r, k)) c.fillRect(40 + (k + quiet) * cell, 40 + (r + quiet) * cell, cell, cell);
    c.textAlign = 'center'; c.fillStyle = '#111';
    let fs = 40; c.font = '900 ' + fs + 'px "Noto Sans TC",sans-serif';
    while(c.measureText(title).width > W - 60 && fs > 18){ fs -= 2; c.font = '900 ' + fs + 'px "Noto Sans TC",sans-serif'; }
    c.fillText(title, W / 2, qs + 40 + 60);
    c.fillStyle = '#555'; c.font = '500 24px "Noto Sans TC",sans-serif';
    c.fillText('跑吧！漢字 · 每天一分鐘', W / 2, qs + 40 + 110);
    return cv;
  }

  // ---- 學習單 PDF（用 canvas 畫成 A4 圖片頁，再包成 PDF，字型不會有缺字問題）----
  const PDFW = 1240, PDFH = 1754, PM = 90;
  const WS_TXT = {
    es: { name: 'Nombre:', date: 'Fecha:', s1: 'Frases', s2: 'Ordena las palabras para formar la frase.', ans: 'Respuestas' },
    en: { name: 'Name:', date: 'Date:', s1: 'Sentences', s2: 'Put the words in order to make a sentence.', ans: 'Answer key' }
  };
  function buildPdf(jpegs, pw, ph){
    const enc = new TextEncoder(), parts = [], offs = [];
    let len = 0;
    const push = b => { const u = typeof b === 'string' ? enc.encode(b) : b; parts.push(u); len += u.length; };
    const n = jpegs.length, objCount = 2 + n * 3;
    push(new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52, 10, 37, 226, 227, 207, 211, 10]));   // %PDF-1.4 + 二進位註記
    const obj = (id, dict, stream) => {
      offs[id] = len; push(id + ' 0 obj\n');
      if(stream){ push(dict.replace('LEN', stream.length) + '\nstream\n'); push(stream); push('\nendstream\nendobj\n'); }
      else push(dict + '\nendobj\n');
    };
    const kids = []; for(let i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>');
    for(let i = 0; i < n; i++){
      const pg = 3 + i * 3, ct = pg + 1, im = pg + 2;
      obj(pg, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>');
      obj(ct, '<< /Length LEN >>', enc.encode('q 595.28 0 0 841.89 0 0 cm /Im0 Do Q'));
      obj(im, '<< /Type /XObject /Subtype /Image /Width ' + pw + ' /Height ' + ph + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length LEN >>', jpegs[i]);
    }
    const xref = len;
    let x = 'xref\n0 ' + (objCount + 1) + '\n0000000000 65535 f \n';
    for(let id = 1; id <= objCount; id++) x += String(offs[id]).padStart(10, '0') + ' 00000 n \n';
    push(x + 'trailer\n<< /Size ' + (objCount + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
    return new Blob(parts, { type: 'application/pdf' });
  }
  function seededShuffle(arr, seed){
    const a = arr.map((v, i) => ({ v, i })); let s = seed * 9301 + 49297;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    if(a.every((o, k) => o.i === k)) a.push(a.shift());
    return a.map(o => o.v);
  }
  async function makeWorksheet(data, opt){
    const script = data.script === 'simp' ? 'simp' : 'trad';
    const L = WS_TXT[opt.lang] || WS_TXT.es;
    const sents = (data.sentences || []).map(s => ({
      words: (s[script] || s.trad || []).slice(),
      py: (s.pinyin || []).slice(),
      tr: (opt.lang === 'en' ? (s.en || s.es) : s.es) || ''
    }));
    const FF = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif';
    const all = sents.map(s => s.words.join('') + s.py.join('') + ZY.conv(s.py.join(' ')) + s.tr).join('') + (data.name || '') + L.name + L.date + L.s1 + L.s2 + L.ans + '0123456789.:_ ';
    try{ await Promise.all([document.fonts.load('900 44px "Noto Sans TC"', all), document.fonts.load('500 26px "Noto Sans TC"', all)]); }catch(e){}
    const pages = [];
    let cv, c, y;
    const newPage = () => {
      cv = document.createElement('canvas'); cv.width = PDFW; cv.height = PDFH; c = cv.getContext('2d');
      c.fillStyle = '#fff'; c.fillRect(0, 0, PDFW, PDFH); c.textBaseline = 'alphabetic'; c.textAlign = 'left';
      pages.push(cv); y = PM;
    };
    const ensure = h => { if(y + h > PDFH - PM - 40) newPage(); };
    const font = (w, px) => { c.font = w + ' ' + px + 'px ' + FF; };
    // 每個詞一格：拼音在上、漢字、注音在下
    const cellInfo = (word, py) => {
      font(900, 44); const wh = c.measureText(word).width;
      let pw = 0, zw = 0, pt = '', zt = '';
      if(opt.pinyin){ pt = py; font(500, 22); pw = c.measureText(pt).width; }
      if(opt.zhuyin){ zt = ZY.conv(py); font(500, 22); zw = c.measureText(zt).width; }
      return { word, pt, zt, w: Math.max(wh, pw, zw) };
    };
    const lineH = (opt.pinyin ? 28 : 0) + 52 + (opt.zhuyin ? 30 : 0);
    const drawCell = (ci, x, top, boxed) => {
      c.textAlign = 'center'; const cx = x + ci.w / 2; let yy = top;
      if(opt.pinyin){ font(500, 22); c.fillStyle = '#555'; c.fillText(ci.pt, cx, yy + 22); yy += 28; }
      font(900, 44); c.fillStyle = '#111'; c.fillText(ci.word, cx, yy + 42); yy += 52;
      if(opt.zhuyin){ font(500, 22); c.fillStyle = '#555'; c.fillText(ci.zt, cx, yy + 22); }
      c.textAlign = 'left';
    };
    // 把一句排成多行，回傳 [{x,ci}] 的行
    const layout = (words, py, x0, maxW, gap, pad) => {
      const lines = [[]]; let x = x0;
      words.forEach((w, i) => {
        const ci = cellInfo(w, py[i] || '');
        const cw = ci.w + pad * 2;
        if(x + cw > x0 + maxW && lines[lines.length - 1].length){ lines.push([]); x = x0; }
        lines[lines.length - 1].push({ x: x + pad, ci, cw }); x += cw + gap;
      });
      return lines;
    };
    newPage();
    font(900, 46); c.fillStyle = '#0a6b73'; c.fillText(data.name || '', PM, y + 44); y += 70;
    font(500, 26); c.fillStyle = '#333';
    c.fillText(L.name + ' ____________________', PM, y + 26);
    c.fillText(L.date + ' ______________', PDFW / 2 + 40, y + 26); y += 58;
    c.strokeStyle = '#0a6b73'; c.lineWidth = 3; c.beginPath(); c.moveTo(PM, y); c.lineTo(PDFW - PM, y); c.stroke(); y += 30;
    font(700, 28); c.fillStyle = '#0a6b73'; c.fillText(L.s1, PM, y + 28); y += 52;

    sents.forEach((s, idx) => {
      const lines = layout(s.words, s.py, PM + 70, PDFW - PM * 2 - 70, 26, 0);
      const h = lines.length * (lineH + 10) + 44 + 24;
      ensure(h);
      font(700, 30); c.fillStyle = '#0a6b73'; c.fillText((idx + 1) + '.', PM, y + (opt.pinyin ? 28 : 0) + 40);
      lines.forEach(line => { line.forEach(o => drawCell(o.ci, o.x, y, false)); y += lineH + 10; });
      font(500, 26); c.fillStyle = '#333'; c.fillText(s.tr, PM + 70, y + 26); y += 44;
      c.strokeStyle = '#ddd'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(PM, y); c.lineTo(PDFW - PM, y); c.stroke(); y += 24;
    });

    if(opt.order){
      const ex = sents.filter(s => s.words.length >= 2);
      if(ex.length){
        newPage();
        font(900, 40); c.fillStyle = '#0a6b73'; c.fillText(L.s2, PM, y + 38); y += 70;
        ex.forEach((s, idx) => {
          const sh = seededShuffle(s.words.map((w, i) => i), idx + 1);
          const lines = layout(sh.map(i => s.words[i]), sh.map(i => s.py[i] || ''), PM + 70, PDFW - PM * 2 - 70, 18, 14);
          const h = 44 + lines.length * (lineH + 34) + 80;
          ensure(h);
          font(700, 30); c.fillStyle = '#0a6b73'; c.fillText((idx + 1) + '.', PM, y + 40);
          font(500, 24); c.fillStyle = '#666'; c.fillText(s.tr, PM + 70, y + 26); y += 44;
          lines.forEach(line => {
            line.forEach(o => {
              c.strokeStyle = '#0a6b73'; c.lineWidth = 2.5;
              const bx = o.x - 14, bw = o.ci.w + 28, bh = lineH + 20;
              c.beginPath(); c.roundRect ? c.roundRect(bx, y - 4, bw, bh, 12) : c.rect(bx, y - 4, bw, bh); c.stroke();
              drawCell(o.ci, o.x, y + 6, true);
            });
            y += lineH + 34;
          });
          c.strokeStyle = '#999'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(PM + 70, y + 40); c.lineTo(PDFW - PM, y + 40); c.stroke();
          y += 80;
        });
        newPage();
        font(900, 40); c.fillStyle = '#0a6b73'; c.fillText(L.ans, PM, y + 38); y += 70;
        ex.forEach((s, idx) => {
          const lines = layout(s.words, s.py, PM + 70, PDFW - PM * 2 - 70, 26, 0);
          ensure(lines.length * (lineH + 10) + 40);
          font(700, 28); c.fillStyle = '#0a6b73'; c.fillText((idx + 1) + '.', PM, y + (opt.pinyin ? 28 : 0) + 38);
          lines.forEach(line => { line.forEach(o => drawCell(o.ci, o.x, y, false)); y += lineH + 10; });
          y += 20;
        });
      }
    }
    // 頁尾
    pages.forEach((p, i) => {
      const g = p.getContext('2d'); g.fillStyle = '#999'; g.font = '500 22px ' + FF; g.textAlign = 'center';
      g.fillText('每天一分鐘 · 跑吧！漢字 · ' + (i + 1) + ' / ' + pages.length, PDFW / 2, PDFH - 50);
    });
    const jpegs = [];
    for(const p of pages){
      const b64 = p.toDataURL('image/jpeg', 0.85).split(',')[1], bin = atob(b64), u = new Uint8Array(bin.length);
      for(let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
      jpegs.push(u);
    }
    return { blob: buildPdf(jpegs, PDFW, PDFH), pages: pages.length };
  }

    setStatus($('clsStatus'), tr('loading'));
    try{
      const snap = await db.collection('class_scores').where('owner', '==', user.uid).where('cid', '==', c.cid).limit(2000).get();
      SCORES = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      setStatus($('clsStatus'), '');
    }catch(e){ console.error(e); SCORES = []; setStatus($('clsStatus'), explainError(e), 'err'); }
    renderScores();
  }
  const GAME_NAMES = { corre: '跑吧！漢字', colores: '色數消消樂' };
  const lastText = ms => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  function renderScores(){
    const box = $('clsScores'); box.textContent = '';
    const games = ['corre'].filter(g => SCORES.some(r => r.game === g));
    $('clsCount').textContent = tr('clsStudents', { n: new Set(SCORES.filter(r => r.game === 'corre').map(r => r.h)).size });
    if(!games.length){ box.appendChild(mk('p', 'hint', tr('clsNoScores'))); return; }
    games.forEach(g => {
      box.appendChild(mk('h3', 'gh', GAME_NAMES[g]));
      const tbl = mk('table', 'gt'); const hr = mk('tr');
      ['#', 'clsNick', 'clsBest', 'clsPlays', 'clsDetail', 'clsLast', ''].forEach(k => hr.appendChild(mk('th', null, k && k !== '#' ? tr(k) : k)));
      tbl.appendChild(hr);
      SCORES.filter(r => r.game === g).sort((a, b) => b.best - a.best).forEach((r, i) => {
        const tr_ = mk('tr');
        const ex = r.extra || {};
        const detail = g === 'corre' ? ((ex.sent != null ? ex.sent + tr('clsSentUnit') : '') + (ex.diff ? ' · ' + tr(ex.diff) : '')) : Object.keys(ex).map(k => k + ':' + ex[k]).join(' ');
        [i + 1, r.nick, r.best, r.plays, detail, r.lastAt && r.lastAt.toMillis ? lastText(r.lastAt.toMillis()) : ''].forEach(v => tr_.appendChild(mk('td', null, String(v))));
        const td = mk('td'); const del = mk('button', 'btn danger small', '✕');
        del.addEventListener('click', async ()=>{
          if(!confirm(tr('clsConfirmRow', { nick: r.nick }))) return;
          try{ await db.collection('class_scores').doc(r.id).delete(); SCORES = SCORES.filter(x => x.id !== r.id); renderScores(); }
          catch(e){ setStatus($('clsStatus'), explainError(e), 'err'); }
        });
        td.appendChild(del); tr_.appendChild(td); tbl.appendChild(tr_);
      });
      const wrap = mk('div', 'gwrap'); wrap.appendChild(tbl); box.appendChild(wrap);
    });
  }
  $('clsRefreshBtn').addEventListener('click', loadScores);
  $('clsCsvBtn').addEventListener('click', ()=>{
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['game', 'nickname', 'best', 'plays', 'detail', 'last'].map(q).join(',')];
    SCORES.filter(r => r.game === 'corre').sort((a, b) => b.best - a.best).forEach(r => {
      const ex = r.extra || {};
      rows.push([GAME_NAMES[r.game] || r.game, r.nick, r.best, r.plays, Object.keys(ex).map(k => k + '=' + ex[k]).join(' '), r.lastAt && r.lastAt.toMillis ? new Date(r.lastAt.toMillis()).toISOString() : ''].map(q).join(','));
    });
    saveBlob(new Blob(['﻿' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }), 'gradebook-' + safeName(CLASSES[CUR].data.name) + '.csv');
  });
  async function deleteScoreDocs(ids){
    for(let i = 0; i < ids.length; i += 400){
      const b = db.batch(); ids.slice(i, i + 400).forEach(id => b.delete(db.collection('class_scores').doc(id))); await b.commit();
    }
  }
  $('clsResetBtn').addEventListener('click', async ()=>{
    if(!confirm(tr('clsConfirmReset'))) return;
    try{ await deleteScoreDocs(SCORES.filter(r => r.game === 'corre').map(r => r.id)); SCORES = SCORES.filter(r => r.game !== 'corre'); renderScores(); }catch(e){ setStatus($('clsStatus'), explainError(e), 'err'); }
  });
  $('clsDelBtn').addEventListener('click', async ()=>{
    const c = CLASSES[CUR]; if(!c) return;
    if(!confirm(tr('clsConfirmDel', { name: c.data.name }))) return;
    setStatus($('clsStatus'), tr('saving'));
    try{
      await deleteScoreDocs(SCORES.map(r => r.id));
      const slots = Object.assign({}, CSLOTS); delete slots[CUR];
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      const b = db.batch();
      b.delete(db.collection('classes').doc(c.cid));
      b.set(db.collection('teacher_classes').doc(user.uid), { slots, updatedAt: ts });
      await b.commit();
      CUR = null; await loadClasses(); showView('viewList'); renderClasses();
    }catch(e){ console.error(e); setStatus($('clsStatus'), explainError(e), 'err'); }
  });

  function applyLang(){
    document.documentElement.lang = HTML_LANG[LANG];
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
    $('langs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
    renderAuth();
    if(ED){ renderEditorMeta(); $('addSentBtn').textContent = editingIdx >= 0 ? tr('updSent') : tr('addSent'); }
    else if(isRealUser(user)){ renderList(); if(CUR){ renderClassHead(); renderScores(); } }
  }
  $('langs').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ LANG = b.dataset.l; try{ localStorage.setItem('correTeacherLang', LANG); }catch(e){} applyLang(); });
  });
  applyLang();

  // 給測試用
  window.__teacher = { get ED(){ return ED; }, makeTokens, countHan, makeWorksheet, buildPdf, qrCanvas, ZY, get CLASSES(){ return CLASSES; }, get SCORES(){ return SCORES; } };
})();
</script>
</body>
</html>
